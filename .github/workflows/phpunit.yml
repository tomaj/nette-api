name: PHPunit

on:
  push:
    branches:
      - master
  pull_request: null

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        experimental: [ false ]
        include:
          - php: '8.6'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    name: PHPunit PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Composer update
        run: composer update --no-progress --no-interaction ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: PHPunit
        run: vendor/bin/phpunit --coverage-text

  lowest:
    runs-on: ubuntu-latest
    name: PHPunit PHP 8.4 lowest dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Composer update
        run: composer update --prefer-lowest --prefer-stable --no-progress --no-interaction

      - name: PHPunit
        run: vendor/bin/phpunit --no-coverage
        env:
          # CORS tests read sent headers via xdebug_get_headers()
          XDEBUG_MODE: develop

  infection:
    runs-on: ubuntu-latest
    name: Infection

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Composer update
        run: composer update --no-progress --no-interaction

      - name: Infection on changed lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          vendor/bin/infection --threads=max --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --min-msi=100 --min-covered-msi=100 --ignore-msi-with-no-mutations --show-mutations

      - name: Infection
        if: github.event_name == 'push'
        run: vendor/bin/infection --threads=max --show-mutations
