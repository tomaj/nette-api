name: PHPstan

on:
  push:
    branches:
      - master
  pull_request: null

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        experimental: [ false ]
        include:
          - php: '8.6'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    name: PHPstan PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Composer update
        run: composer update --no-progress --no-interaction ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: PHPstan
        run: vendor/bin/phpstan analyse --no-progress
